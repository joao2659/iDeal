<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Redefinir senha — iDeal</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    background: #F6F7FA;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 20px;
  }
  .card {
    background: #fff;
    width: 100%;
    max-width: 400px;
    border-radius: 20px;
    padding: 32px 28px;
    box-shadow: 0 12px 40px rgba(19,27,58,0.12);
    border: 1px solid #E3E6EE;
  }
  h1 {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 22px;
    color: #131B3A;
    margin: 0 0 8px;
  }
  p.subtitulo {
    color: #5B6478;
    font-size: 14px;
    margin: 0 0 24px;
    line-height: 1.4;
  }
  label {
    display: block;
    font-size: 13px;
    color: #131B3A;
    margin-bottom: 6px;
    font-weight: 700;
  }
  input {
    width: 100%;
    padding: 12px 14px;
    border: 1.5px solid #E3E6EE;
    border-radius: 12px;
    font-size: 15px;
    margin-bottom: 16px;
    background: #F6F7FA;
  }
  input:focus { outline: none; border-color: #FF5A3C; background: #fff; }
  button {
    width: 100%;
    padding: 13px;
    background: #FF5A3C;
    color: #fff;
    border: none;
    border-radius: 999px;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
  }
  button:hover { background: #E8432A; }
  button:disabled { opacity: 0.6; cursor: not-allowed; }
  #mensagem {
    font-size: 13px;
    padding: 12px 14px;
    border-radius: 10px;
    margin-bottom: 16px;
    display: none;
  }
  #mensagem.error { background: #FDEBEB; color: #C43030; display: block; }
  #mensagem.success { background: #E7F7F2; color: #137A5F; display: block; }
  a.voltar {
    display: block;
    text-align: center;
    margin-top: 18px;
    font-size: 13.5px;
    color: #5B6478;
  }
</style>
</head>
<body>

<div class="card">
  <h1>Criar nova senha</h1>
  <p class="subtitulo">Digite a nova senha da sua conta iDeal.</p>

  <div id="mensagem"></div>

  <div id="areaFormulario">
    <label for="novaSenha">Nova senha</label>
    <input id="novaSenha" type="password" placeholder="Mínimo 6 caracteres" />

    <label for="confirmarSenha">Confirmar nova senha</label>
    <input id="confirmarSenha" type="password" placeholder="Digite novamente" />

    <button id="btnSalvar" onclick="salvarNovaSenha()">Salvar nova senha</button>
  </div>

  <a class="voltar" href="ideal-entrar.html">Voltar para o login</a>
</div>

<script src="assets/supabase-client.js"></script>
<script>
  async function salvarNovaSenha() {
    const novaSenha = document.getElementById('novaSenha').value;
    const confirmarSenha = document.getElementById('confirmarSenha').value;
    const mensagemEl = document.getElementById('mensagem');
    const botao = document.getElementById('btnSalvar');

    mensagemEl.className = '';

    if (!novaSenha || novaSenha.length < 6) {
      mensagemEl.className = 'error';
      mensagemEl.textContent = 'A senha precisa ter pelo menos 6 caracteres.';
      return;
    }

    if (novaSenha !== confirmarSenha) {
      mensagemEl.className = 'error';
      mensagemEl.textContent = 'As senhas não coincidem.';
      return;
    }

    botao.disabled = true;
    botao.textContent = 'Salvando...';

    const { error } = await idealSupabase.auth.updateUser({ password: novaSenha });

    botao.disabled = false;
    botao.textContent = 'Salvar nova senha';

    if (error) {
      mensagemEl.className = 'error';
      mensagemEl.textContent = 'Não foi possível salvar. O link pode ter expirado — solicite um novo na tela de login.';
      console.error(error);
      return;
    }

    document.getElementById('areaFormulario').innerHTML =
      '<p style="color:#137A5F; font-size:15px; line-height:1.5;">' +
      'Senha alterada com sucesso! Você já pode fazer login com a senha nova.' +
      '</p>';
  }
</script>

</body>
</html>
